# Gradle JVM: sized for a 14 GB machine that also runs Windows, the Dart
# analysis server, an IDE, and adb. The previous -Xmx8G + 4G metaspace (12 GB)
# starved the OS and forced constant disk swapping, which made every build
# crawl. 4 GB heap is ample for this project and leaves real headroom.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Build-speed flags — safe for every build path (debug, release, CI):
#  parallel        : run independent module tasks concurrently
#  caching         : reuse task outputs across builds (huge on rebuilds)
#  configureondemand: only configure the projects a task actually needs
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Keep the Kotlin/Gradle daemons warm between runs so back-to-back builds skip
# JVM start-up and configuration.
org.gradle.daemon=true
kotlin.incremental=true
